<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghoomar AI Concierge | The Golden Leaf</title>
    
    <!-- Google Fonts: Premium Typography matching the main site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link to our upcoming Masterclass CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="ai-portal-body">

    <div class="chat-wrapper">
        <!-- 1. Premium Header -->
        <header class="chat-header">
            <div class="brand-info">
                <div class="ai-avatar-pulse">
                    <i class="fas fa-crown"></i>
                </div>
                <div class="brand-text">
                    <h1>Ghoomar | AI Concierge</h1>
                    <span class="status-indicator"><i class="fas fa-circle"></i> Secure Server Active</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="clearChatBtn" title="Reset Conversation"><i class="fas fa-sync-alt"></i></button>
            </div>
        </header>

        <!-- 2. Main Chat Display Area -->
        <main class="chat-display" id="chatDisplay">
            <!-- ChatGPT Recommended: Welcome Card -->
            <div class="welcome-card">
                <i class="fas fa-leaf gold-leaf"></i>
                <h2>The Golden Leaf</h2>
                <p>Welcome to our exclusive digital concierge. I can assist you with our menu, operating hours, or secure a table reservation for you.</p>
            </div>
            
            <!-- Dynamic Messages will be injected here via JavaScript -->
        </main>

        <!-- 3. ChatGPT Recommended: Quick Actions / Suggested Prompts -->
        <div class="quick-actions" id="quickActions">
            <button class="chip" onclick="sendQuickMessage('What are your opening hours?')">Opening Hours</button>
            <button class="chip" onclick="sendQuickMessage('I want to book a table')">Book a Table</button>
            <button class="chip" onclick="sendQuickMessage('What are the Chef Specials?')">Chef Specials</button>
        </div>

        <!-- 4. Input Engine -->
        <footer class="chat-input-area">
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Type your request here..." autocomplete="off">
                <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
            <div class="secure-badge">
                <i class="fas fa-shield-alt"></i> End-to-End Encrypted Reservation System
            </div>
        </footer>
    </div>

    <!-- Link to our upcoming Logic Engine -->
    <script src="/static/script.js"></script>
</body>
</html>
